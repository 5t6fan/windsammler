<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sicherheitsprüfung – Windsammler</title>
<!-- Wird von der Windsammler-App (iOS/Android) in einem eingebetteten Browserfenster geöffnet.
     Das Captcha-Ergebnis (Token) geht per postMessage an die App, die damit das Spielerkonto anlegt. -->
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; background: transparent; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  #hinweis { color: #5d6b66; text-align: center; padding: 8px; }
</style>
</head>
<body>
<div>
  <div id="captcha"></div>
  <div id="hinweis">Sicherheitsprüfung wird geladen …</div>
</div>
<script src="config.js"></script>
<script>
  function melde(nachricht) {
    var text = JSON.stringify(nachricht);
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(text);
    else if (window.parent !== window) window.parent.postMessage(text, '*');
  }
  function los() {
    document.getElementById('hinweis').textContent = '';
    window.turnstile.render('#captcha', {
      sitekey: window.WINDSAMMLER_CONFIG.turnstileSiteKey,
      language: 'de',
      callback: function (token) { melde({ token: token }); },
      'expired-callback': function () { melde({ abgelaufen: true }); },
      'error-callback': function () { melde({ fehler: 'Sicherheitsprüfung fehlgeschlagen' }); },
    });
  }
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=los" async
  onerror="document.getElementById('hinweis').textContent='Sicherheitsprüfung nicht ladbar – Internetverbindung prüfen.'; melde({ fehler: 'nicht ladbar' });"></script>
</body>
</html>
